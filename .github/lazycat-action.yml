version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/stremio.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: stremio

build:
  run_buildscript: false

images:
  - id: stremio
    target: service
    service: stremio
    source: tsaridas/stremio-docker
    channel: stable
    tag_regex: '^v\d+\.\d+\.\d+$'
    version_regex: '^v(?P<version>\d+\.\d+\.\d+)$'
    version_template: '{version}'
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    create_if_missing: false
    changelog_locales: [zh, en]
    retry:
      enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Stremio
    summary: Published from GitHub Actions
